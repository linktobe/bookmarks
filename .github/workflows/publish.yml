name: 发布收藏夹

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "sites/**"
      - "src/**"
      - "web/**"
      - "scripts/**"
  schedule:
    # 每天两个时点各触发一次（04:17 / 16:17 UTC）。GitHub 的 schedule 是尽力而为，
    # 低活跃仓库常被推迟数小时；两次中哪一次先落地就由它复查，另一次会发现
    # 24 小时内已经查过，由脚本自行跳过。这样连续推送之外，仍有兜底的一次。
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取回上次的链接检查结果
        uses: actions/cache@v4
        with:
          path: data/link-status.json
          key: link-status-${{ github.run_id }}
          restore-keys: |
            link-status-

      - name: 取回上次的仓库元数据
        uses: actions/cache@v4
        with:
          path: data/repo-meta.json
          key: repo-meta-${{ github.run_id }}
          restore-keys: |
            repo-meta-

      - name: 刷新星标数与最近提交日期
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 每仓库 1000 次/时的配额
        run: python scripts/update_meta.py

      - name: 检查仓库与网站状态（24 小时内查过则跳过）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 配额 60/h → 5000/h
        run: python scripts/check_links.py

      - name: 生成站点
        run: python src/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
