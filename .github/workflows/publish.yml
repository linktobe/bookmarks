name: 发布收藏夹

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "sites/**"
      - "src/**"
      - "web/**"
      - "scripts/**"
  schedule:
    # 每天 04:17 UTC 复查一次；24 小时内查过则由脚本自动跳过
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取回上次的链接检查结果
        uses: actions/cache@v4
        with:
          path: data/link-status.json
          key: link-status-${{ github.run_id }}
          restore-keys: |
            link-status-

      - name: 检查仓库与网站状态（24 小时内查过则跳过）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 配额 60/h → 5000/h
        run: python scripts/check_links.py

      - name: 生成站点
        run: python src/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
