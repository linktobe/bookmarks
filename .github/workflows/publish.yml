name: 发布收藏夹

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "sites/**"
      - "src/**"
      - "web/**"
      - "scripts/**"
  schedule:
    # 每周一 04:17 UTC 复查一次链接，没改内容也会跑
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查仓库状态（失效 / 迁移 / 归档）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 配额 60/h → 5000/h
        run: python scripts/check_links.py

      - name: 生成站点
        run: python src/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
